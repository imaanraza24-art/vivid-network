<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Vivid Network</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div id="nav-root"></div>

<header class="page-header">
  <div class="wrap">
    <span class="eyebrow">Contact</span>
    <h1 class="display" style="margin-top:16px;">Let's talk.</h1>
    <p class="sub">Have a story idea, want to collaborate, want to be on the podcast, or just want to say hi?</p>
  </div>
</header>

<section class="section" style="padding-top:0;">
  <div class="wrap">
    <form class="form reveal" onsubmit="handleContactSubmit(event)">
      <div class="form-row two">
        <div>
          <label for="c-name">Name</label>
          <input type="text" id="c-name" required>
        </div>
        <div>
          <label for="c-email">Email</label>
          <input type="email" id="c-email" required>
        </div>
      </div>

      <div class="form-row">
        <label for="c-subject">Subject</label>
        <input type="text" id="c-subject" required>
      </div>

      <div class="form-row">
        <label for="c-message">Message</label>
        <textarea id="c-message" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>

    <div id="contact-confirm" style="display:none;margin-top:32px;" class="involve-card">
      <h3>Message sent.</h3>
      <p>Thanks for reaching out — the Vivid Network team will get back to you soon.</p>
    </div>
  </div>
</section>

<div id="footer-root"></div>

<script src="assets/data.js"></script>
<script src="assets/components.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => renderNav("contact"));

  function handleContactSubmit(e){
    e.preventDefault();
    e.target.style.display = "none";
    document.getElementById("contact-confirm").style.display = "block";
  }
</script>
</body>
</html>
